<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HireScope AI | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0a0a0c;
            --card-bg: #16161a;
            --primary-neon: #818cf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* BACKGROUND BLOBS */
        .bg-animations {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(100px);
            opacity: 0.3;
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            animation: move 25s infinite alternate;
        }

        .blob-1 { background: #312e81; top: -10%; left: -5%; }
        .blob-2 { background: #4c1d95; bottom: -10%; right: -5%; }

        @keyframes move {
            from { transform: translate(0,0); }
            to { transform: translate(100px, 100px); }
        }

        /* GLASS CARD */
        .glass {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 400px;
            z-index: 1;
        }

        /* INPUTS */
        input {
            background: #1f1f23 !important;
            color: white !important;
            border: 1px solid #333 !important;
            padding: 10px;
        }

        .form-control::placeholder {
        color: #c7d4e6 !important;
        opacity: 1 !important;
        }

        /* BUTTON */
        .btn-primary {
            background-color: var(--primary-neon);
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #6366f1;
        }

        .text-primary {
            color: var(--primary-neon) !important;
        }

    </style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg-animations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<!-- CARD -->
<div class="glass shadow-lg">

    <h2 class="fw-bold mb-2 text-center">
        Welcome!
    </h2>
    <p class="text-center text-white-50 mb-4">
        Login to continue with HireScope AI
    </p>

    <form method="post">

        <div class="mb-3">
            <input name="email" class="form-control" placeholder="Email Address" required>
        </div>

        <div class="mb-4">
            <input name="password" type="password" class="form-control" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>

    </form>

    <p class="text-center text-white-50 mt-4 small">
        New here?
        <a href="/signup" class="text-primary text-decoration-none fw-bold">
            Create account
        </a>
    </p>

</div>

</body>
</html>
